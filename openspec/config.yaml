schema: spec-driven

context: |
  Язык: русский (ru-RU).
  Все OpenSpec-артефакты и пояснения должны быть написаны на русском языке.
  Имена файлов, команды, идентификаторы кода и обязательные структурные
  ключевые слова OpenSpec (Requirement, Scenario, GIVEN, WHEN, THEN) остаются
  на английском языке.

  Продукт: полностью офлайн-приложение, которое показывает заранее загруженные
  субтитры синхронно с фильмом. Приложение не воспроизводит видео или аудио.
  Первый целевой клиент: Android. Стек: Flutter и Dart.

  Главные инженерные приоритеты: детерминированный монотонный таймер,
  независимые seek/delay/rate, корректные пересекающиеся субтитры и тестируемая
  domain-логика без зависимости от Flutter widgets.

  Подробный исходный контекст находится в 01-product-requirements.md,
  02-architecture.md и 03-implementation-and-tests.md.

rules:
  proposal:
    - Явно описывай цели, границы изменения и non-goals.
    - Перечисляй затронутые capabilities и риски для офлайн-режима.
  specs:
    - Для каждого требования добавляй минимум один проверяемый Scenario.
    - Используй интервалы субтитров [start, end) и не предполагай единственный активный cue.
  design:
    - Отделяй domain-логику от Flutter UI и сторонних моделей парсера.
    - Объясняй решения, влияющие на точность времени и Android lifecycle.
  tasks:
    - Добавляй тесты рядом с каждой задачей, меняющей поведение.
    - Завершай план полным запуском format, analyze и test.

operations:
  apply:
    guidance:
      - Сначала выполняй domain-задачи и их тесты, затем UI и интеграции.
      - Не добавляй сетевые зависимости или функции вне согласованного change.
  archive:
    guidance:
      - Архивируй change только после выполнения задач и успешной проверки CI-команд.
